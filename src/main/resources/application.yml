server:
  port: 8080

spring:
  application:
    name: jwt-auth-service
  datasource:
    url: jdbc:h2:mem:authdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

app:
  jwt:
    # Base64 encoded key (min 256 bit). Override with env var JWT_SECRET in production.
    secret: ${JWT_SECRET:IgpX/mWJE0ze7e01P/cAMhnh8vl3JjkFV0TJdob5AsKliIilLSrfjPLzGi+DBN50}
    expiration-ms: 3600000
  seed-admin:
    email: admin@example.com
    password: Admin@12345

---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/authdb?createDatabaseIfNotExist=true}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
